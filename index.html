<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vestra - Invoicing App</title>
  
  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
    }

    /* Auth View */
    #auth-view {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .auth-card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid #334155;
    }
    .brand-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 32px;
    }
    #google-btn-container {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
      min-height: 45px;
    }
    .status-msg {
      margin-top: 15px;
      font-size: 14px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }
    .status-msg.success {
      display: block;
      background-color: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .manual-enter-btn {
      display: none;
      width: 100%;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }
    .manual-enter-btn:hover {
      background-color: #7dd3fc;
    }

    /* Dashboard View */
    #dashboard-view {
      display: none;
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      border-bottom: 1px solid #334155;
      padding-bottom: 20px;
    }
    .user-info {
      font-size: 14px;
      color: #94a3b8;
    }
    .user-info span {
      color: #38bdf8;
      font-weight: 600;
    }
    .btn-logout {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-logout:hover {
      background-color: #dc2626;
    }
    .dashboard-card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 20px;
      margin-bottom: 16px;
      color: #f1f5f9;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="auth-view">
    <div class="auth-card">
      <h1 class="brand-title">Vestra</h1>
      <p class="brand-subtitle">Sign in to access your invoices</p>

      <!-- Google Sign-In Button Container -->
      <div id="google-btn-container"></div>

      <!-- Fallback Enter Button if Google SDK silent state halts view change -->
      <button id="manual-enter" class="manual-enter-btn" onclick="forceEnterDashboard()">Enter Vestra Dashboard</button>

      <div id="status" class="status-msg"></div>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboard-view">
    <header>
      <div>
        <h1 class="brand-title" style="font-size: 24px; margin-bottom: 4px;">Vestra Dashboard</h1>
        <div class="user-info">Welcome back, <span id="user-display-name">FCSHORTS</span>!</div>
      </div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </header>

    <div class="dashboard-card">
      <h2>Your Invoices</h2>
      <p>Your session is active and authenticated. Ready to create, track, and manage your invoices!</p>
    </div>
  </div>

<script>
  const GOOGLE_CLIENT_ID = "197408277690-35up6132og0mlafbhpfqgjh3kobsfemd.apps.googleusercontent.com";

  window.onload = function () {
    if (sessionStorage.getItem("vestra_logged_in") === "true") {
      showDashboard("FCSHORTS");
      return;
    }

    let checkGoogle = setInterval(() => {
      if (window.google && window.google.accounts) {
        clearInterval(checkGoogle);
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleGoogleResponse
        });

        google.accounts.id.renderButton(
          document.getElementById("google-btn-container"),
          { theme: "outline", size: "large", width: "250" }
        );
      }
    }, 100);
  };

  function handleGoogleResponse(response) {
    sessionStorage.setItem("vestra_logged_in", "true");
    
    // Automatically reveal the direct entry button so you can instantly bypass any iframe block
    document.getElementById('status').className = "status-msg success";
    document.getElementById('status').innerText = "Successfully authenticated with Google!";
    document.getElementById('manual-enter').style.display = "block";

    // Try immediate transition too
    setTimeout(() => {
      showDashboard("FCSHORTS");
    }, 500);
  }

  function forceEnterDashboard() {
    sessionStorage.setItem("vestra_logged_in", "true");
    showDashboard("FCSHORTS");
  }

  function showDashboard(name) {
    document.getElementById('auth-view').style.display = 'none';
    document.getElementById('dashboard-view').style.display = 'block';
    document.getElementById('user-display-name').innerText = name;
  }

  function logout() {
    sessionStorage.clear();
    window.location.reload();
  }
</script>

</body>
</html>
