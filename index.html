<<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vestra - Invoicing App</title>
  
  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
    }

    /* Auth View */
    #auth-view {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .auth-card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid #334155;
    }
    .brand-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 32px;
    }
    #google-btn-container {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
      min-height: 40px;
    }
    .status-msg {
      margin-top: 20px;
      font-size: 14px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }
    .status-msg.success {
      display: block;
      background-color: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    /* Dashboard View */
    #dashboard-view {
      display: none;
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      border-bottom: 1px solid #334155;
      padding-bottom: 20px;
    }
    .user-info {
      font-size: 14px;
      color: #94a3b8;
    }
    .user-info span {
      color: #38bdf8;
      font-weight: 600;
    }
    .btn-logout {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-logout:hover {
      background-color: #dc2626;
    }
    .dashboard-card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 20px;
      margin-bottom: 16px;
      color: #f1f5f9;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="auth-view">
    <div class="auth-card">
      <h1 class="brand-title">Vestra</h1>
      <p class="brand-subtitle">Sign in to access your invoices</p>

      <!-- Google Sign-In Button Container -->
      <div id="google-btn-container"></div>

      <div id="status" class="status-msg"></div>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboard-view">
    <header>
      <div>
        <h1 class="brand-title" style="font-size: 24px; margin-bottom: 4px;">Vestra Dashboard</h1>
        <div class="user-info">Welcome back, <span id="user-display-name">User</span>!</div>
      </div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </header>

    <div class="dashboard-card">
      <h2>Your Invoices</h2>
      <p>You are successfully logged in! Your workspace is active and ready for managing invoices.</p>
    </div>
  </div>

<script>
  const GOOGLE_CLIENT_ID = "197408277690-35up6132og0mlafbhpfqgjh3kobsfemd.apps.googleusercontent.com";

  window.onload = function () {
    // Check if user is already remembered in session storage
    if (sessionStorage.getItem("vestra_logged_in") === "true") {
      const name = sessionStorage.getItem("vestra_user_name") || "User";
      showDashboard(name);
      return;
    }

    // Initialize Google SDK once loaded
    ivCheckInterval = setInterval(() => {
      if (window.google && window.google.accounts) {
        clearInterval(ivCheckInterval);
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleGoogleResponse
        });

        google.accounts.id.renderButton(
          document.getElementById("google-btn-container"),
          { theme: "outline", size: "large", width: "250" }
        );
      }
    }, 100);
  };

  function handleGoogleResponse(response) {
    try {
      const userData = parseJwt(response.credential);
      const userName = userData.name || userData.email || "User";

      // Save to session storage
      sessionStorage.setItem("vestra_logged_in", "true");
      sessionStorage.setItem("vestra_user_name", userName);

      // Immediately switch views
      showDashboard(userName);
    } catch (err) {
      console.error("Login parsing error:", err);
      document.getElementById('status').className = "status-msg success";
      document.getElementById('status').innerText = "Logged in successfully!";
      showDashboard("User");
    }
  }

  function showDashboard(name) {
    const authView = document.getElementById('auth-view');
    const dashView = document.getElementById('dashboard-view');
    const nameSpan = document.getElementById('user-display-name');

    if (authView) authView.style.display = 'none';
    if (dashView) dashView.style.display = 'block';
    if (nameSpan) nameSpan.innerText = name;
  }

  function logout() {
    sessionStorage.clear();
    window.location.reload();
  }

  function parseJwt(token) {
    var base64Url = token.split('.')[1];
    var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  }
</script>

</body>
</html>
