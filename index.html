<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vestra - Invoicing App</title>
  
  <!-- Google Sign-In SDK with FedCM enabled for modern browsers -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
    }

    /* Auth View */
    #auth-view {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .auth-card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid #334155;
    }
    .brand-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 32px;
    }
    #google-btn-container {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
      min-height: 50px;
    }
    .status-msg {
      margin-top: 15px;
      font-size: 14px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }
    .status-msg.success {
      display: block;
      background-color: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .status-msg.error {
      display: block;
      background-color: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* Dashboard View */
    #dashboard-view {
      display: none;
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      border-bottom: 1px solid #334155;
      padding-bottom: 20px;
    }
    .user-info {
      font-size: 14px;
      color: #94a3b8;
    }
    .user-info span {
      color: #38bdf8;
      font-weight: 600;
    }
    .btn-logout {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-logout:hover {
      background-color: #dc2626;
    }
    .dashboard-card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 20px;
      margin-bottom: 16px;
      color: #f1f5f9;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="auth-view">
    <div class="auth-card">
      <h1 class="brand-title">Vestra</h1>
      <p class="brand-subtitle">Sign in to access your invoices</p>

      <!-- Google Sign-In Button Container -->
      <div id="google-btn-container"></div>

      <div id="status" class="status-msg"></div>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboard-view">
    <header>
      <div>
        <h1 class="brand-title" style="font-size: 24px; margin-bottom: 4px;">Vestra Dashboard</h1>
        <div class="user-info">Logged in as: <span id="user-display-email">user@gmail.com</span></div>
      </div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </header>

    <div class="dashboard-card">
      <h2>Invoice Workspace</h2>
      <p>Your Google authentication is active. Premium customer access verified!</p>
    </div>
  </div>

<script>
  const GOOGLE_CLIENT_ID = "197408277690-35up6132og0mlafbhpfqgjh3kobsfemd.apps.googleusercontent.com";

  // Check session persistence immediately when page loads
  window.addEventListener('DOMContentLoaded', () => {
    const savedEmail = localStorage.getItem("vestra_user_email");
    if (savedEmail) {
      console.log("Found existing session for:", savedEmail);
      showDashboard(savedEmail);
    }
  });

  // Initialize Google SDK safely once script loads
  window.onload = function () {
    let checkGSI = setInterval(() => {
      if (window.google && window.google.accounts) {
        clearInterval(checkGSI);
        console.log("Google Identity SDK loaded successfully.");

        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: window.handleGoogleResponse,
          use_fedcm_for_prompt: true
        });

        google.accounts.id.renderButton(
          document.getElementById("google-btn-container"),
          { theme: "outline", size: "large", width: "280", shape: "rectangular" }
        );
      }
    }, 100);
  };

  // Must be globally attached so Google SDK can trigger it
  window.handleGoogleResponse = function(response) {
    console.log("Google response received:", response);
    
    if (!response.credential) {
      showError("Google authentication failed. No token received.");
      return;
    }

    try {
      const userData = parseJwt(response.credential);
      const userEmail = userData.email || "Premium User";
      console.log("Decoded user email:", userEmail);

      // Save session permanently so they stay logged in
      localStorage.setItem("vestra_logged_in", "true");
      localStorage.setItem("vestra_user_email", userEmail);

      // Show success and transition instantly
      const statusEl = document.getElementById('status');
      statusEl.className = "status-msg success";
      statusEl.innerText = "Successfully logged in! Opening dashboard...";

      setTimeout(() => {
        showDashboard(userEmail);
      }, 600);

    } catch (err) {
      console.error("Error parsing user token:", err);
      showError("Error processing login details.");
    }
  };

  function showDashboard(email) {
    document.getElementById('auth-view').style.display = 'none';
    document.getElementById('dashboard-view').style.display = 'block';
    document.getElementById('user-display-email').innerText = email;
  }

  function showError(msg) {
    const statusEl = document.getElementById('status');
    statusEl.className = "status-msg error";
    statusEl.innerText = msg;
  }

  function logout() {
    localStorage.removeItem("vestra_logged_in");
    localStorage.removeItem("vestra_user_email");
    window.location.reload();
  }

  function parseJwt(token) {
    var base64Url = token.split('.')[1];
    var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  }
</script>

</body>
</html>
