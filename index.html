<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vestra - Sign In</title>
  
  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- Apple Sign-In SDK -->
  <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .auth-card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid #334155;
    }
    .brand-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 32px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-google {
      background-color: #ffffff;
      color: #1f2937;
    }
    .btn-google:hover {
      background-color: #f3f4f6;
    }
    .btn-apple {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #334155;
    }
    .btn-apple:hover {
      background-color: #111827;
    }
    .status-msg {
      margin-top: 20px;
      font-size: 14px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }
    .status-msg.success {
      display: block;
      background-color: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .status-msg.info {
      display: block;
      background-color: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
  </style>
</head>
<body>

<div class="auth-card">
  <h1 class="brand-title">Vestra</h1>
  <p class="brand-subtitle">Sign in to access your account</p>

  <!-- Google Button -->
  <button class="btn btn-google" id="google-login-btn">
    <svg width="18" height="18" viewBox="0 0 18 18">
      <path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.72L.97 13.01C2.47 15.98 5.48 18 9 18z"/>
      <path fill="#FBBC05" d="M3.87 10.8c-.18-.53-.28-1.11-.28-1.8s.1-1.27.28-1.8L.97 4.99C.35 6.22 0 7.58 0 9s.35 2.78.97 4.01l2.9-2.21z"/>
      <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.47 2.02.97 4.99l2.9 2.21C4.59 5.05 6.62 3.58 9 3.58z"/>
    </svg>
    Continue with Google
  </button>

  <!-- Apple Button -->
  <button class="btn btn-apple" id="apple-login-btn">
    <svg width="18" height="18" viewBox="0 0 170 170" fill="currentColor">
      <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-5.01.12-9.93-1.93-14.75-6.14-3.26-2.73-7.14-7.42-11.65-14.07-6.21-9.15-11.1-19.16-14.67-30.03-3.58-10.87-5.37-21.28-5.37-31.23 0-14.26 3.69-25.92 11.08-34.98 7.39-9.06 16.54-13.68 27.46-13.87 4.69 0 9.8 1.16 15.33 3.48 5.53 2.32 9.29 3.48 11.27 3.48 1.63 0 5.5-.12 11.62-3.37 6.12-3.25 11.51-4.72 16.17-4.42 12.08.98 21.65 5.43 28.71 13.35-10.77 6.53-16.03 15.66-15.79 27.39.24 9.15 3.81 16.8 10.7 22.95 6.9 6.15 15.02 9.58 24.38 10.29-2.44 7.29-5.71 14.39-9.8 21.29zM119.22 31.85c0-6.75 2.45-13.25 7.35-19.5 4.9-6.25 11.03-10.23 18.39-11.94.65 7.07-1.36 13.78-6.03 20.13-4.67 6.35-10.87 10.38-18.6 12.1-0.22-0.26-0.53-0.52-0.93-0.79h-.18z"/>
    </svg>
    Continue with Apple
  </button>

  <div id="status" class="status-msg"></div>
</div>

<script>
  // Replace the string below with your actual Client ID copied from Google Cloud Console
  const GOOGLE_CLIENT_ID = "197408277690-YOUR_FULL_CLIENT_ID_HERE.apps.googleusercontent.com";
  
  const APPLE_CLIENT_ID = "com.yourdomain.app.service";
  const REDIRECT_URI = window.location.href;

  window.onload = function () {
    // 1. Initialize Google
    if (window.google && !GOOGLE_CLIENT_ID.includes("YOUR_FULL_CLIENT_ID_HERE")) {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleResponse
      });
    }

    // 2. Initialize Apple
    if (window.AppleID) {
      AppleID.auth.init({
        clientId: APPLE_CLIENT_ID,
        scope: 'name email',
        redirectURI: REDIRECT_URI,
        usePopup: true
      });
    }
  };

  // Google Login Trigger
  document.getElementById('google-login-btn').addEventListener('click', () => {
    const statusEl = document.getElementById('status');
    if (GOOGLE_CLIENT_ID.includes(197408277690-35up6132og0mlafbhpfqgjh3kobsfemd.apps.googleusercontent.com)) {
      statusEl.className = "status-msg info";
      statusEl.innerText = "Demo Mode: Replace GOOGLE_CLIENT_ID in index.html with your full ID from Google Console.";
    } else {
      google.accounts.id.prompt();
    }
  });

  function handleGoogleResponse(response) {
    const statusEl = document.getElementById('status');
    statusEl.className = "status-msg success";
    statusEl.innerText = "Successfully authenticated with Google!";
    console.log("Google Token:", response.credential);
  }

  // Apple Login Trigger
  document.getElementById('apple-login-btn').addEventListener('click', async () => {
    const statusEl = document.getElementById('status');
    if (APPLE_CLIENT_ID.includes("com.yourdomain")) {
      statusEl.className = "status-msg info";
      statusEl.innerText = "Demo Mode: Apple Client ID not configured.";
    } else {
      try {
        const data = await AppleID.auth.signIn();
        statusEl.className = "status-msg success";
        statusEl.innerText = "Successfully authenticated with Apple!";
        console.log("Apple Response:", data);
      } catch (error) {
        console.error("Apple Sign-In Error:", error);
      }
    }
  });
</script>

</body>
</html>
