<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reseller Quick Profit Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <h1 class="text-xl font-bold mb-1 text-white">Reseller Margin Calculator</h1>
        <p class="text-sm text-slate-400 mb-6">Calculate your exact take-home cash after platform fees.</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Buy Price (£)</label>
                <input type="number" id="buyPrice" placeholder="e.g. 50" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
            </div>
            
            <div>
                <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Sell Price (£)</label>
                <input type="number" id="sellPrice" placeholder="e.g. 120" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Estimated Postage/Shipping (£)</label>
                <input type="number" id="shipping" placeholder="e.g. 3.49" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div class="pt-4 border-t border-slate-800 mt-6 space-y-2">
                <div class="flex justify-between text-sm">
                    <span class="text-slate-400">Net Profit:</span>
                    <span id="netProfit" class="font-bold text-emerald-400 text-lg">£0.00</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-slate-400">Return on Investment (ROI):</span>
                    <span id="roi" class="font-semibold text-indigo-400">0%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const buyInput = document.getElementById('buyPrice');
        const sellInput = document.getElementById('sellPrice');
        const shipInput = document.getElementById('shipping');
        const netProfitEl = document.getElementById('netProfit');
        const roiEl = document.getElementById('roi');

        function calculate() {
            const buy = parseFloat(buyInput.value) || 0;
            const sell = parseFloat(sellInput.value) || 0;
            const ship = parseFloat(shipInput.value) || 0;

            // Assuming standard zero seller fees platform (like Vinted) or adjust as needed
            const net = sell - buy - ship;
            const roi = buy > 0 ? (net / buy) * 100 : 0;

            netProfitEl.textContent = `£${net.toFixed(2)}`;
            roiEl.textContent = `${roi.toFixed(1)}%`;
            
            if (net < 0) {
                netProfitEl.className = "font-bold text-rose-500 text-lg";
            } else {
                netProfitEl.className = "font-bold text-emerald-400 text-lg";
            }
        }

        [buyInput, sellInput, shipInput].forEach(input => {
            input.addEventListener('input', calculate);
        });
    </script>
</body>
</html>
